<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detect</title>
  <style>
    body {
      font-family: monospace;
    }
  </style>
</head>

<body>
  <script>
    'use strict';
    function addRow(expr, value) {
      var p = document.createElement('p');
      var code = document.createElement('code');
      code.textContent = expr;
      p.appendChild(code);
      p.appendChild(document.createTextNode(': ' + value));
      document.body.appendChild(p);
    }

    var checks = [
      { expr: 'navigator.userAgent', fn: function () { return navigator.userAgent; } },
      { expr: 'navigator.language', fn: function () { return navigator.language; } },
      { expr: 'screen.width', fn: function () { return screen.width; } },
      { expr: 'screen.height', fn: function () { return screen.height; } },
      { expr: 'navigator.maxTouchPoints', fn: function () { return navigator.maxTouchPoints; } },
      { expr: 'navigator.hardwareConcurrency', fn: function () { return navigator.hardwareConcurrency; } },

      { expr: "'serviceWorker' in navigator", fn: function () { return 'serviceWorker' in navigator; } },
      { expr: "'localStorage' in window", fn: function () { return 'localStorage' in window; } },
      { expr: "'geolocation' in navigator", fn: function () { return 'geolocation' in navigator; } },
      { expr: "typeof matchMedia === 'function'", fn: function () { return typeof matchMedia === 'function'; } },
      {
        expr: "matchMedia('(prefers-color-scheme: dark)').matches",
        fn: function () { return matchMedia('(prefers-color-scheme: dark)').matches; }
      },

      { expr: "'indexedDB' in window", fn: function () { return 'indexedDB' in window; } },
      { expr: "'WebSocket' in window", fn: function () { return 'WebSocket' in window; } },
      { expr: "'RTCPeerConnection' in window", fn: function () { return 'RTCPeerConnection' in window; } },
      { expr: 'navigator.onLine', fn: function () { return navigator.onLine; } },
      {
        expr: "'connection' in navigator && navigator.connection.effectiveType",
        fn: function () { return 'connection' in navigator && navigator.connection.effectiveType; }
      },

      { expr: "CSS.supports('display','grid')", fn: function () { return CSS.supports('display', 'grid'); } },
      { expr: "'WebAssembly' in window", fn: function () { return 'WebAssembly' in window; } },
      { expr: "'WebGLRenderingContext' in window", fn: function () { return 'WebGLRenderingContext' in window; } },

      { expr: "'ontouchstart' in window", fn: function () { return 'ontouchstart' in window; } },
      { expr: "'PointerEvent' in window", fn: function () { return 'PointerEvent' in window; } },
      { expr: "'pointerEnabled' in Navigator.prototype", fn: function () { return 'pointerEnabled' in Navigator.prototype; } },
      { expr: "'DeviceOrientationEvent' in window", fn: function () { return 'DeviceOrientationEvent' in window; } },

      { expr: "'PushManager' in window", fn: function () { return 'PushManager' in window; } },
      { expr: "'Notification' in window", fn: function () { return 'Notification' in window; } },
      { expr: "'PaymentRequest' in window", fn: function () { return 'PaymentRequest' in window; } },
      { expr: "'clipboard' in navigator", fn: function () { return 'clipboard' in navigator; } },
      { expr: "'share' in navigator", fn: function () { return 'share' in navigator; } },

      {
        expr: "typeof navigator.getInstalledRelatedApps === 'function'",
        fn: function () { return typeof navigator.getInstalledRelatedApps === 'function'; }
      },
      { expr: "typeof navigator.getBattery === 'function'", fn: function () { return typeof navigator.getBattery === 'function'; } },
      {
        expr: "'mediaDevices' in navigator && 'getUserMedia' in navigator.mediaDevices",
        fn: function () { return 'mediaDevices' in navigator && 'getUserMedia' in navigator.mediaDevices; }
      },
      { expr: "'sync' in ServiceWorkerRegistration.prototype", fn: function () { return 'sync' in ServiceWorkerRegistration.prototype; } }
    ];

    checks.forEach(function (c) {
      try {
        addRow(c.expr, c.fn());
      } catch (e) {
        addRow(c.expr, false);
      }
    });
  </script>
  <footer>
    <p><a href="https://github.com/wantaekchoi/detect"
        target="_blank" rel="noopener noreferrer">https://github.com/wantaekchoi/detect</a></p>
  </footer>
</body>

</html>
